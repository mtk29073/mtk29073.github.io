<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>東京地下鐵路線圖 · Tokyo Subway Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@400;600;700&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea; --water:#cfe2ec; --river:#bcd7e6; --park:#dce8cf; --parkText:#7f9a6c; --waterText:#7fa2b8;
  --ink:#1d2127; --muted:#6b7380; --dim:#9aa1ac;
  --casing:#f4f1ea; --halo:#f4f1ea; --st-outer:#24282e; --st-inner:#ffffff;
  --glass:rgba(255,255,255,.82); --glass2:rgba(255,255,255,.95); --line:rgba(20,30,50,.09); --shadow:0 12px 40px rgba(40,40,60,.16);
  --accent:#e8473f; --accent2:#2f7de1; --hover:rgba(0,0,0,.045);
  --grid:rgba(0,0,0,.035);
}
body.dark{
  --bg:#0a0f1d; --water:#0e1f33; --river:#12304a; --park:#0f2219; --parkText:#3f6b4f; --waterText:#3d6386;
  --ink:#e8edf6; --muted:#8c97ad; --dim:#5a6680;
  --casing:#0a0f1d; --halo:#0a0f1d; --st-outer:#e8edf6; --st-inner:#0a0f1d;
  --glass:rgba(16,22,40,.82); --glass2:rgba(20,28,50,.96); --line:rgba(255,255,255,.08); --shadow:0 12px 40px rgba(0,0,0,.5);
  --hover:rgba(255,255,255,.06); --grid:rgba(255,255,255,.025);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:"Noto Sans TC","Noto Sans JP","Microsoft JhengHei","Yu Gothic UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);transition:background .4s,color .4s}
.num,.mono{font-family:"Outfit","Noto Sans TC",sans-serif;font-variant-numeric:tabular-nums}
#map{position:fixed;inset:0;width:100%;height:100%;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#map.dragging{cursor:grabbing}
#map .gridbg{fill:url(#gridPat)}
.water{fill:var(--water);transition:fill .4s}
.river{fill:none;stroke:var(--river);stroke-linecap:round;stroke-linejoin:round;transition:stroke .4s}
.park{fill:var(--park);transition:fill .4s}
.decoText{font-weight:700;letter-spacing:.3em;pointer-events:none}
.decoText.p{fill:var(--parkText)} .decoText.w{fill:var(--waterText);font-style:italic;letter-spacing:.5em}
.casing{fill:none;stroke:var(--casing);stroke-linecap:round;stroke-linejoin:round;transition:opacity .3s}
.ln{fill:none;stroke-linecap:round;stroke-linejoin:round;transition:opacity .3s}
.ln.jr{stroke-dasharray:none}
.dimmed{opacity:.12}
.st{cursor:pointer;transition:opacity .3s}
.st .o{stroke-linecap:round}
.st .i{stroke-linecap:round;stroke:var(--st-inner);pointer-events:none}
.st.x .o{stroke:var(--st-outer)}
.st:hover .o{filter:drop-shadow(0 0 4px rgba(0,0,0,.35))}
.st.selected .o{stroke:var(--accent)!important}
.lab{pointer-events:none;transition:opacity .25s}
.lab text{paint-order:stroke;stroke:var(--halo);stroke-width:3.2px;stroke-linejoin:round;fill:var(--ink)}
.lab .ja{font-family:"Noto Sans JP","Noto Sans TC",sans-serif;font-weight:700}
.lab .en{font-family:"Outfit",sans-serif;font-weight:500;fill:var(--muted)}
.lab.x .ja{font-weight:900}
.lab.hid{opacity:0}
.train{pointer-events:none}
.train circle{stroke:#fff;stroke-width:1.6}
body.dark .train circle{stroke:#0a0f1d}
#trains{filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.routeHalo{fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.28}
.routeLine{fill:none;stroke-linecap:round;stroke-linejoin:round}
.routeDash{fill:none;stroke:#fff;stroke-linecap:round;stroke-dasharray:2 12;animation:dash 1.1s linear infinite;opacity:.95}
@keyframes dash{to{stroke-dashoffset:-14}}
.pinA,.pinB{pointer-events:none}

/* ---------- panel ---------- */
#panel{position:fixed;left:16px;top:16px;bottom:16px;width:380px;display:flex;flex-direction:column;background:var(--glass);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;z-index:5;transition:background .4s}
.brand{padding:18px 20px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.logo{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;background:conic-gradient(from 210deg,#F39700,#E60012,#9CAEB7,#00A7DB,#009944,#C1A470,#8F76D6,#00ADA9,#9C5E31,#E85298,#0079C2,#6CBB5A,#B6007A,#F39700);box-shadow:0 6px 18px rgba(0,0,0,.18)}
.logo span{width:26px;height:26px;border-radius:50%;background:var(--glass2);display:grid;place-items:center;font:900 13px "Outfit";color:var(--ink)}
.brand h1{font-size:18px;font-weight:900;letter-spacing:.06em}
.brand small{display:block;font:600 10px "Outfit";letter-spacing:.2em;color:var(--muted);margin-top:2px}
.brand .sp{flex:1}
.ibtn{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:var(--glass2);color:var(--ink);cursor:pointer;display:grid;place-items:center;font-size:15px;transition:.2s}
.ibtn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.pscroll{flex:1;overflow-y:auto;padding:14px 16px 20px;scrollbar-width:thin;scrollbar-color:rgba(127,127,127,.3) transparent}
.pscroll::-webkit-scrollbar{width:6px}.pscroll::-webkit-scrollbar-thumb{background:rgba(127,127,127,.3);border-radius:3px}
.card{background:var(--glass2);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.sec{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.18em;margin:4px 2px 10px;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.rf{display:grid;grid-template-columns:1fr 34px;gap:8px;align-items:center}
.rfi{display:flex;flex-direction:column;gap:8px;position:relative}
.rfi::before{content:"";position:absolute;left:14px;top:22px;bottom:22px;border-left:2px dotted var(--dim)}
.inp{position:relative}
.inp i{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:12px;height:12px;border-radius:50%;border:3px solid #22a06b;background:var(--glass2);z-index:1}
.inp.b i{border-color:var(--accent);border-radius:3px}
.inp input{width:100%;padding:10px 12px 10px 32px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px;outline:none;transition:.2s}
.inp input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(47,125,225,.15)}
.ac{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--glass2);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:20;max-height:300px;overflow-y:auto;display:none}
.ac.on{display:block}
.ac div{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;font-size:13px}
.ac div.on,.ac div:hover{background:var(--hover)}
.ac .en{color:var(--muted);font:12px "Outfit";flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go{width:100%;margin-top:10px;padding:10px;border:none;border-radius:12px;background:linear-gradient(135deg,#ff6a5c,#e8473f);color:#fff;font:inherit;font-weight:700;font-size:14px;letter-spacing:.1em;cursor:pointer;box-shadow:0 6px 18px rgba(232,71,63,.3);transition:.2s}
.go:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(232,71,63,.4)}
.pref{display:flex;gap:6px;margin-top:10px}
.pref button{flex:1;padding:6px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:12px;cursor:pointer}
.pref button.on{background:var(--ink);color:var(--bg);border-color:transparent;font-weight:700}

.rsum{display:flex;align-items:baseline;gap:14px;margin:12px 0 4px;padding-top:12px;border-top:1px dashed var(--line)}
.rsum .t{font:700 34px/1 "Outfit"}
.rsum .t small{font-size:14px;font-weight:600;margin-left:2px;color:var(--muted)}
.rsum .m{font-size:12px;color:var(--muted);line-height:1.6}
.rsum .m b{color:var(--ink)}
.steps{margin-top:10px;position:relative}
.stp{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;min-height:30px}
.stp .dot{width:16px;height:16px;border-radius:50%;border:3.5px solid var(--st-outer);background:var(--st-inner);justify-self:center;z-index:1}
.stp .nm{font-weight:700;font-size:15px;font-family:"Noto Sans JP","Noto Sans TC"}
.stp .nm small{font:500 11px "Outfit";color:var(--muted);margin-left:6px}
.stp .tm{font:600 12px "Outfit";color:var(--muted)}
.leg{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:stretch}
.leg .bar{width:6px;justify-self:center;border-radius:3px;margin:-4px 0}
.leg .info{padding:8px 0 10px;font-size:12px;color:var(--muted)}
.leg .info .ttl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);font-weight:700;margin-bottom:3px}
.leg .info details summary{cursor:pointer;list-style:none;margin-top:3px;color:var(--accent2)}
.leg .info details summary::-webkit-details-marker{display:none}
.leg .info details div{padding:4px 0 0 2px;line-height:1.75;color:var(--muted)}
.xfer{display:grid;grid-template-columns:22px 1fr;gap:10px}
.xfer .w{justify-self:center;border-left:2px dashed var(--dim);margin:-2px 0}
.xfer span{font-size:11px;color:var(--muted);padding:6px 0}

.lgrp{margin-bottom:10px}
.lgh{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);margin:2px 4px 6px}
.lgh label{display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:500}
.lgh input{accent-color:var(--accent2)}
.lrow{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:12px;cursor:pointer;transition:.15s}
.lrow:hover{background:var(--hover)}
.lrow.on{background:var(--hover);box-shadow:inset 3px 0 0 var(--c)}
.lrow .n{flex:1;font-weight:700;font-size:14px}
.lrow .n small{display:block;font:500 11px "Outfit";color:var(--muted)}
.lrow .cnt{font:600 11px "Outfit";color:var(--muted)}
.lb{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;border:4px solid var(--c);background:var(--glass2);font:800 12px "Outfit";color:var(--ink);flex:none}
.lb.s{width:20px;height:20px;border-width:3px;font-size:9px}
.cb{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;border:3.5px solid var(--c);background:#fff;color:#1d2127;font:800 9px/1 "Outfit";flex:none}
.cb b{font-size:10px;font-weight:800}
.cb span{font-size:11px;font-weight:700;margin-top:1px}
.cb.sq{border-radius:7px}
.cb.sm{width:24px;height:24px;border-width:3px;font-size:8px}
.cb.sm b{font-size:8px}.cb.sm span{font-size:9px}

/* line strip */
.strip-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.strip-h h2{font-size:22px;font-weight:900;letter-spacing:.06em}
.strip-h small{display:block;font:500 12px "Outfit";color:var(--muted)}
.back{border:none;background:none;color:var(--accent2);font:inherit;font-size:13px;cursor:pointer;padding:4px 0;margin-bottom:8px}
.strip{position:relative;padding-left:4px}
.srow{display:grid;grid-template-columns:34px 22px 1fr;gap:8px;align-items:center;min-height:38px;cursor:pointer;border-radius:10px;padding-right:6px;position:relative}
.srow:hover{background:var(--hover)}
.srow .rail{position:absolute;left:51px;top:0;bottom:0;width:7px;background:var(--c);transform:translateX(-50%)}
.srow:first-child .rail{top:50%}.srow:last-child .rail{bottom:50%}
.srow .sd{width:16px;height:16px;border-radius:50%;background:var(--st-inner);border:3.5px solid var(--c);z-index:1;justify-self:center}
.srow.x .sd{border-color:var(--st-outer);width:18px;height:18px}
.srow .snm{font-weight:700;font-size:14px;font-family:"Noto Sans JP","Noto Sans TC";display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.srow .snm small{font:500 11px "Outfit";color:var(--muted);font-weight:500}
.srow .xf{display:flex;gap:3px;margin-left:auto}
.srow .code{font:700 11px "Outfit";color:var(--muted);text-align:right}

/* ---------- floating UI ---------- */
#tools{position:fixed;right:16px;top:16px;display:flex;flex-direction:column;gap:8px;z-index:5}
#tools .ibtn{width:40px;height:40px;border-radius:13px;background:var(--glass);backdrop-filter:blur(14px);box-shadow:var(--shadow);font-size:17px}
#tools .ibtn.on{background:var(--ink);color:var(--bg)}
#scale{position:fixed;right:20px;bottom:20px;z-index:4;font:600 11px "Outfit";color:var(--muted);text-align:center;pointer-events:none}
#scale div{height:6px;border:2px solid var(--muted);border-top:none;margin-top:2px}
#tip{position:fixed;z-index:30;pointer-events:none;background:var(--glass2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;box-shadow:var(--shadow);opacity:0;transition:opacity .12s;font-size:12px;white-space:nowrap}
#tip .tn{font-weight:900;font-size:15px;font-family:"Noto Sans JP","Noto Sans TC"}
#tip .te{font:500 11px "Outfit";color:var(--muted)}
#tip .tc{display:flex;gap:4px;margin-top:6px}
#scard{position:fixed;right:72px;top:16px;width:320px;z-index:6;background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:16px 18px;transform:translateY(-10px);opacity:0;pointer-events:none;transition:.25s}
#scard.on{transform:none;opacity:1;pointer-events:auto}
#scard .x{position:absolute;right:12px;top:12px;border:none;background:none;color:var(--muted);font-size:18px;cursor:pointer}
#scard .codes{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
#scard h2{font-size:28px;font-weight:900;letter-spacing:.08em;font-family:"Noto Sans JP","Noto Sans TC"}
#scard .en{font:500 14px "Outfit";color:var(--muted)}
#scard .ll{margin:12px 0 4px;display:flex;flex-direction:column;gap:2px}
#scard .ll div{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:4px 6px;border-radius:9px;cursor:pointer}
#scard .ll div:hover{background:var(--hover)}
#scard .ll div small{font:500 11px "Outfit";color:var(--muted);margin-left:auto}
#scard .osi{font-size:12px;color:var(--muted);margin-top:6px}
#scard .btns{display:flex;gap:8px;margin-top:12px}
#scard .btns button{flex:1;padding:9px;border-radius:12px;border:1px solid var(--line);background:var(--glass2);color:var(--ink);font:inherit;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
#scard .btns button:hover{border-color:var(--accent2)}
#scard .btns i{width:10px;height:10px;border-radius:50%;border:3px solid #22a06b}
#scard .btns button.b i{border-color:var(--accent);border-radius:2px}
.hint{font-size:11.5px;color:var(--muted);line-height:1.8;padding:10px 12px;border-radius:12px;border:1px dashed var(--line)}
.hint kbd{font:10px "Outfit";border:1px solid var(--line);border-radius:4px;padding:0 4px}
.note{font-size:10.5px;color:var(--dim);line-height:1.6;margin-top:10px}

/* ---------- Q 版主題（選單、車站卡、工具按鈕；地圖本體不變） ---------- */
:root{ --q-ink:#3b3a4a; --q-line:#3b3a4a; --q-paper:#fffaf0; --q-card:#ffffff; --q-soft:#fff3d9; --q-dot:rgba(255,143,171,.20);
  --q-pink:#ff7f9f; --q-mint:#7ed6c4; --q-sun:#ffd166; --q-sky:#8ecdf7; --q-drop:rgba(59,58,74,.22); }
body.dark{ --q-ink:#f6f1ff; --q-line:#a99ee0; --q-paper:#2a2540; --q-card:#342e4f; --q-soft:#3d3660; --q-dot:rgba(255,255,255,.06); --q-drop:rgba(0,0,0,.35); }
#panel, #scard, #tip, #tools, .ac{ font-family:"M PLUS Rounded 1c","Noto Sans TC","Noto Sans JP",sans-serif; }
#panel{ background:var(--q-paper) radial-gradient(circle at 13px 13px, var(--q-dot) 3px, transparent 3.5px) 0 0/26px 26px;
  border:3px solid var(--q-line); border-radius:30px; box-shadow:0 8px 0 var(--q-drop), 0 18px 40px rgba(0,0,0,.15); backdrop-filter:none; -webkit-backdrop-filter:none; }
.brand{ border-bottom:3px dashed var(--q-drop); padding:16px 18px 12px; }
.logo{ width:58px; height:58px; border-radius:0; background:none; box-shadow:none; animation:qbob 2.6s ease-in-out infinite; }
.logo svg{ width:58px; height:58px; display:block; }
@keyframes qbob{ 50%{ transform:translateY(-4px) rotate(-4deg); } }
.brand h1{ font-weight:800; letter-spacing:.04em; color:var(--q-ink); font-size:19px; }
.brand small{ font-family:inherit; letter-spacing:.04em; font-size:11.5px; font-weight:700; color:var(--q-pink); }
.card{ background:var(--q-card); border:2.5px solid var(--q-line); border-radius:22px; box-shadow:0 5px 0 var(--q-drop); }
.sec{ font-size:14px; letter-spacing:.04em; color:var(--q-ink); font-weight:800; }
.sec::after{ height:0; background:none; border-top:3px dotted var(--q-drop); }
.rfi::before{ border-left:3px dotted var(--q-pink); left:17px; }
.inp i{ border:none !important; background:none !important; width:20px; height:20px; left:10px; border-radius:0 !important; font-style:normal; font-size:16px; line-height:20px; text-align:center; }
.inp.a i::before{ content:"🏠"; } .inp.b i::before{ content:"🚩"; }
.inp input{ border:2.5px solid var(--q-line); border-radius:999px; background:var(--q-card); color:var(--q-ink); padding:11px 14px 11px 38px; font-weight:700; font-family:inherit; }
.inp input:focus{ border-color:var(--q-pink); box-shadow:0 0 0 4px rgba(255,127,159,.25); }
.ibtn{ border:2.5px solid var(--q-line); border-radius:50%; background:var(--q-card); box-shadow:0 3px 0 var(--q-line); font-weight:800; }
.ibtn:hover{ transform:translateY(-2px) rotate(-8deg); }
.go{ border-radius:999px; background:var(--q-pink); border:3px solid var(--q-line); box-shadow:0 5px 0 var(--q-line); color:#fff; font:800 16px "M PLUS Rounded 1c",sans-serif; letter-spacing:.06em; text-shadow:0 1px 0 rgba(0,0,0,.18); transition:transform .12s, box-shadow .12s; }
.go:hover{ transform:translateY(-2px); box-shadow:0 7px 0 var(--q-line); }
.go:active{ transform:translateY(3px); box-shadow:0 2px 0 var(--q-line); }
.pref button{ border:2.5px solid var(--q-line); border-radius:999px; font:700 13px "M PLUS Rounded 1c",sans-serif; color:var(--q-ink); background:var(--q-card); padding:7px; }
.pref button.on{ background:var(--q-sun); color:#3b3a4a; border-color:var(--q-line); box-shadow:0 3px 0 var(--q-line); }
.rsum{ border-top:3px dashed var(--q-drop); }
.rsum .t{ font-family:"M PLUS Rounded 1c",sans-serif; font-weight:800; color:var(--q-pink); }
.stp .dot{ border-width:4px; width:18px; height:18px; }
.leg .bar{ width:10px; border-radius:6px; }
.leg .info .ttl{ font-weight:800; }
.lgrp{ padding:12px; }
.lgh{ font-size:14px; color:var(--q-ink); font-weight:800; }
.lgh label{ background:var(--q-soft); border-radius:999px; padding:3px 10px 3px 6px; font-weight:700; }
.lrow{ border-radius:16px; border:2.5px solid transparent; margin:3px 0; padding:7px 8px; transition:transform .15s, border-color .15s, background .15s; }
.lrow:hover{ border-color:var(--c); background:color-mix(in srgb, var(--c) 10%, var(--q-card)); transform:translateX(3px) rotate(-.6deg); }
.lrow.on{ border-color:var(--c); background:color-mix(in srgb, var(--c) 14%, var(--q-card)); box-shadow:none; }
.lrow .n{ font-weight:800; }
.lrow .n small{ font-family:inherit; }
.lrow .cnt{ font:800 11px "M PLUS Rounded 1c",sans-serif; color:var(--q-ink); background:color-mix(in srgb, var(--c) 22%, var(--q-card)); border-radius:999px; padding:3px 9px; }
.lb{ border-width:4px; width:32px; height:32px; background:radial-gradient(circle at 35% 30%, #fff 0 38%, #f4f4f4 39%); color:#3b3a4a; font:800 12px "M PLUS Rounded 1c",sans-serif; box-shadow:0 3px 0 var(--q-drop); }
.lb.s{ width:22px; height:22px; border-width:3px; font-size:9px; box-shadow:0 2px 0 var(--q-drop); }
.cb{ box-shadow:0 2px 0 var(--q-drop); }

function smoothPath(arr, closed){

function catmull(p, closed){
  const n = p.length; if (n<2) return '';
  let d = `M${p[0][0].toFixed(1)},${p[0][1].toFixed(1)}`;
  const get = i => closed ? p[(i+n)%n] : p[Math.max(0,Math.min(n-1,i))];
  const last = closed ? n : n-1;
  for (let i=0;i<last;i++){
    const p0=get(i-1), p1=get(i), p2=get(i+1), p3=get(i+2);
    const c1=[p1[0]+(p2[0]-p0[0])/6, p1[1]+(p2[1]-p0[1])/6], c2=[p2[0]-(p3[0]-p1[0])/6, p2[1]-(p3[1]-p1[1])/6];
    d += `C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d + (closed?'Z':'');
}

const scr = s => [s.wx*state.view.k + state.view.x, s.wy*state.view.k + state.view.y];
const lwOf = k => Math.max(2.6, Math.min(11, 4.2*Math.pow(k,.55)));
function lineGeometry(L, lw){
  const n = L.seq.length, gap = lw + 1.6, loop = !!L.loop;
  const P = L.seq.map(id => scr(ST[id]));
  const segOff = [];
  for (let i=0;i<n-1;i++){
    const a=L.seq[i], b=L.seq[i+1], arr=SEGS.get(segKey(a,b)).filter(id => visibleLine(LMAP[id]));
    if (arr.length<=1){ segOff.push(null); continue; }
    const off = (arr.indexOf(L.id)-(arr.length-1)/2)*gap;
    const [ca,cb] = a<b ? [a,b] : [b,a]; const pa=scr(ST[ca]), pb=scr(ST[cb]);
    const dx=pb[0]-pa[0], dy=pb[1]-pa[1], len=Math.hypot(dx,dy)||1;
    segOff.push([-dy/len*off, dx/len*off, off]);
  }
  const pts = P.map((p,i) => {
    let o1 = segOff[i-1], o2 = segOff[i];
    if (loop){ if (i===0) o1 = segOff[n-2]; if (i===n-1) o2 = segOff[0]; }
    let ox=0, oy=0;
    if (o1 && o2){
      // miter join of two offset segments
      const m1=Math.abs(o1[2]), m2=Math.abs(o2[2]);
      const ax=o1[0]/m1, ay=o1[1]/m1, bx=o2[0]/m2, by=o2[1]/m2;
      let mx=ax+bx, my=ay+by; const ml=Math.hypot(mx,my);
      if (ml<.2){ ox=o2[0]; oy=o2[1]; }
      else { mx/=ml; my/=ml; const dot=mx*ax+my*ay, mag=Math.min(((m1+m2)/2)/Math.max(.35,dot), 3*Math.max(m1,m2)); ox=mx*mag; oy=my*mag; }
    } else if (o1){ ox=o1[0]; oy=o1[1]; } else if (o2){ ox=o2[0]; oy=o2[1]; }
    return [p[0]+ox, p[1]+oy];

/* ---------- label placement (greedy, collision-aware) ---------- */
function placeLabels(){
  const k = state.view.k, W = innerWidth, H = innerHeight;
  const showEn = state.en && k >= 1.5;
  const fsJ = Math.max(10, Math.min(15, 10.5*Math.pow(k,.18))), fsE = fsJ*.72;
  const boxes = [];
  // station symbols are obstacles
  STA.forEach(s => { if (!s.vis) return; const r=s.ow/2+1;
    boxes.push([Math.min(s.a[0],s.b[0])-r, Math.min(s.a[1],s.b[1])-r, Math.max(s.a[0],s.b[0])+r, Math.max(s.a[1],s.b[1])+r, s.id]); });
  const routeSt = state.route ? state.route.stations : null;
  const pri = s => (routeSt && routeSt.has(s.id) ? -100 : 0) + (state.sel===s.id ? -200 : 0) + (state.focus && s.lines.some(l=>LMAP[l].group===state.focus) ? -50 : 0)
    - s.groups.length*10 - (s.term?6:0) - (s.xchg?4:0);
  const order = STA.filter(s => s.vis).sort((a,b) => pri(a)-pri(b));
  const placed = [];
  const hit = (b, own) => {
    for (const o of boxes) if (o[4]!==own && b[0]<o[2] && b[2]>o[0] && b[1]<o[3] && b[3]>o[1]) return true;
    for (const o of placed) if (b[0]<o[2] && b[2]>o[0] && b[1]<o[3] && b[3]>o[1]) return true;
    return false;
  };
  const minK = 0.55; // below this only interchange labels
  order.forEach(s => {
    s.lab.classList.add('hid'); s.labPos = null;
    if (k < minK && !s.xchg && !s.term) return;
    const jw = s.ja.length*fsJ*1.02, ew = showEn ? s.en.length*fsE*.56 : 0, w = Math.max(jw, ew), h = fsJ*1.15 + (showEn ? fsE*1.15 : 0);
    const x0=Math.min(s.a[0],s.b[0])-s.ow/2, x1=Math.max(s.a[0],s.b[0])+s.ow/2, y0=Math.min(s.a[1],s.b[1])-s.ow/2, y1=Math.max(s.a[1],s.b[1])+s.ow/2;
    const g = 3;
    const cands = [
      [x1+g, s.cy-h/2], [x0-g-w, s.cy-h/2], [s.cx-w/2, y0-g-h], [s.cx-w/2, y1+g],
      [x1+g, y0-g-h*.85], [x1+g, y1+g-h*.15], [x0-g-w, y0-g-h*.85], [x0-g-w, y1+g-h*.15],
    ];
    for (const [lx,ly] of cands){
      const b = [lx, ly, lx+w, ly+h];
      if (b[2]<0 || b[0]>W || b[3]<0 || b[1]>H) continue;
      if (hit(b, s.id)) continue;
      placed.push(b);
      s.labPos = [lx - s.cx, ly - s.cy];
      s.tja.setAttribute('x',0); s.tja.setAttribute('y',(fsJ*.92).toFixed(1)); s.tja.setAttribute('font-size',fsJ.toFixed(1));
      s.ten.setAttribute('x',0); s.ten.setAttribute('y',(fsJ*1.15+fsE*.95).toFixed(1)); s.ten.setAttribute('font-size',fsE.toFixed(1));
      s.ten.style.display = showEn ? '' : 'none';
      // right-align text when placed to the left
      const right = lx + w <= x0;
      const anchor = right ? 'end' : (Math.abs(lx+w/2-s.cx)<1 ? 'middle' : 'start');
      const ax = anchor==='end' ? w : anchor==='middle' ? w/2 : 0;
      s.tja.setAttribute('text-anchor',anchor); s.ten.setAttribute('text-anchor',anchor);
      s.tja.setAttribute('x',ax); s.ten.setAttribute('x',ax);
      s.lab.setAttribute('transform', `translate(${lx.toFixed(1)},${ly.toFixed(1)})`);
      s.lab.classList.remove('hid');
      break;
    }
  });
}

   Trains (simulated, for ambience)

const trains = [];
function seedTrains(){
  gTrains.innerHTML = ''; trains.length = 0;
  LINES.forEach(L => {
    const nSeg = L.seq.length-1, n = Math.max(2, Math.round(nSeg/2.6));
    for (let j=0;j<n;j++){
      const t = {L, s: (j+Math.random()*.6)/n*nSeg, dir: Math.random()<.5?1:-1, dwell:0, speed:.38+Math.random()*.08};
      t.g = el('g',{class:'train'}, gTrains);
      t.c = el('circle',{fill:L.color}, t.g);

    }
  });
}
function updateTrains(dt){
  const lw = lwOf(state.view.k), r = lw*.62+1.2;
  for (const t of trains){
    const L = t.L, g = L.geo;
    if (!g || !state.trains){ t.g.style.display='none'; continue; }
    const nSeg = g.segs.length;
    if (t.dwell > 0) t.dwell -= dt;
    else {
      // t.s is kept unwrapped for loop lines; stop briefly at every station
      const prev = t.s; let ns = t.s + t.dir*t.speed*dt;

        else if (t.dir<0 && Math.ceil(ns) < Math.ceil(prev)){ ns = Math.ceil(ns); t.dwell = .55; }

    const ss = L.loop ? ((t.s % nSeg) + nSeg) % nSeg : t.s;
    const i = Math.min(nSeg-1, Math.floor(ss)), f = ss - i;
    const p = bez(g.segs[i], Math.min(1,f));
    t.g.style.display='';
    t.g.setAttribute('transform', `translate(${p[0].toFixed(1)},${p[1].toFixed(1)})`);
    t.c.setAttribute('r', r.toFixed(2));
    const dim = (state.focus && LMAP[state.focus].group!==L.group) || state.route;
    t.g.style.opacity = dim ? .12 : 1;
  }
}

function panelW(){ return innerWidth > 820 ? 412 : 0; }
function fitView(ids, animate=true, maxK=KMAX){
  const list = ids ? ids.map(i=>ST[i]) : STA.filter(s => s.lines.some(l => visibleLine(LMAP[l])));
  const xs = list.map(s=>s.wx), ys = list.map(s=>s.wy);
  const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  const pl = panelW()+40, pr = 80, pt = 50, pb = 50;
  const aw = innerWidth-pl-pr, ah = innerHeight-pt-pb;
  const k = Math.max(KMIN, Math.min(maxK, aw/Math.max(1,x1-x0), ah/Math.max(1,y1-y0)));
  const x = pl + aw/2 - k*(x0+x1)/2, y = pt + ah/2 - k*(y0+y1)/2;

let fly = null;
function cancelFly(){ if (fly){ cancelAnimationFrame(fly); fly = null; } }
function flyTo(target, ms){

  const t0 = performance.now(), ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;

  const cx = innerWidth/2, cy = innerHeight/2;
  const wf = [(cx-from.x)/from.k, (cy-from.y)/from.k], wt = [(cx-target.x)/target.k, (cy-target.y)/target.k];
  const step = now => {

/* =====================================================================
   Route search (Dijkstra over station×line states)
   ===================================================================== */
function buildGraph(){
  const adj = new Map(), add = (a,b,w,info) => { if(!adj.has(a)) adj.set(a,[]); adj.get(a).push({to:b,w,info}); };
  LINES.forEach(L => {
    if (!visibleLine(L)) return;
    for (let i=0;i<L.seq.length-1;i++){
      const a=L.seq[i], b=L.seq[i+1], km=hav(ST[a],ST[b]), t=Math.max(1.4, km/.58 + .55);
      add(a+'|'+L.id, b+'|'+L.id, t, {type:'ride', line:L.id, i, j:i+1, km});
      add(b+'|'+L.id, a+'|'+L.id, t, {type:'ride', line:L.id, i:i+1, j:i, km});
    }
  });
  STA.forEach(s => {
    const ls = s.lines.filter(l => visibleLine(LMAP[l]));
    ls.forEach(a => ls.forEach(b => { if (a===b) return;
      const same = LMAP[a].group===LMAP[b].group, jr = LMAP[a].op==='jr' || LMAP[b].op==='jr', op = LMAP[a].op!==LMAP[b].op;
      add(s.id+'|'+a, s.id+'|'+b, same?1.5: jr?7: op?5.5:4, {type:'xfer', st:s.id}); }));
    s.osi.forEach(o => { const ol = ST[o].lines.filter(l => visibleLine(LMAP[l]));
      ls.forEach(a => ol.forEach(b => add(s.id+'|'+a, o+'|'+b, 8, {type:'walk', from:s.id, to:o}))); });
  });

}
function findRoute(A, B, pref){

  const heap = []; const push = (k,d) => { heap.push([d,k]); let i=heap.length-1; while(i>0){ const p=(i-1)>>1; if(heap[p][0]<=heap[i][0]) break; [heap[p],heap[i]]=[heap[i],heap[p]]; i=p; } };
  const pop = () => { const top=heap[0], last=heap.pop(); if(heap.length){ heap[0]=last; let i=0; for(;;){ const l=2*i+1, r=l+1; let m=i; if(l<heap.length&&heap[l][0]<heap[m][0]) m=l; if(r<heap.length&&heap[r][0]<heap[m][0]) m=r; if(m===i) break; [heap[m],heap[i]]=[heap[i],heap[m]]; i=m; } } return top; };
  ST[A].lines.filter(l => visibleLine(LMAP[l])).forEach(l => { dist.set(A+'|'+l, 0); push(A+'|'+l, 0); });
  let end = null;
  while (heap.length){
    const [d,k] = pop(); if (done.has(k)) continue; done.add(k);
    if (k.split('|')[0]===B){ end = k; break; }
    for (const e of adj.get(k)||[]){
      const nd = d + e.w + (e.info.type!=='ride' ? XP : 0);
      if (nd < (dist.get(e.to) ?? Infinity)){ dist.set(e.to, nd); prev.set(e.to, {k, e}); push(e.to, nd); }
    }
  }
  if (!end) return null;
  const edges = []; let k = end; while (prev.has(k)){ const p = prev.get(k); edges.unshift(p.e); k = p.k; }
  // compress into legs
  const legs = [], steps = []; let cur = null, total = 0, km = 0, xfers = 0;
  for (const e of edges){
    total += e.w;
    if (e.info.type==='ride'){
      km += e.info.km;
      if (!cur || cur.line!==e.info.line){ cur = {line:e.info.line, idx:[e.info.i], t:0, km:0}; legs.push(cur); steps.push({type:'leg', leg:cur}); }
      cur.idx.push(e.info.j); cur.t += e.w; cur.km += e.info.km;
    } else {
      steps.push({type:e.info.type, st:e.info.st, from:e.info.from, to:e.info.to, t:e.w});
      cur = null;
    }
  }
  xfers = steps.filter(s => s.type!=='leg').length;
  const stations = new Set();
  legs.forEach(l => l.idx.forEach(i => stations.add(LMAP[l.line].seq[i])));
  return {A, B, legs, steps, total, km, xfers, stations};
}
function renderRoute(lw){
  gRoute.innerHTML = '';
  if (!state.route) return;
  state.route.legs.forEach(leg => {
    const L = LMAP[leg.line]; if (!L.geo) return;
    const seqs = [];
    for (let i=0;i<leg.idx.length-1;i++) seqs.push(subPath(L, leg.idx[i], leg.idx[i+1]));
    const d = seqs.join(' ');
    el('path',{class:'routeHalo', d, stroke:L.color, 'stroke-width':(lw*3.2).toFixed(1)}, gRoute);
    el('path',{class:'casing', d, 'stroke-width':(lw*1.6+2.4).toFixed(1)}, gRoute);
    el('path',{class:'routeLine', d, stroke:L.color, 'stroke-width':(lw*1.6).toFixed(1)}, gRoute);
    el('path',{class:'routeDash', d, 'stroke-width':(lw*.45).toFixed(1)}, gRoute);
  });
  state.route.steps.filter(s => s.type==='walk').forEach(s => {
    const a = ST[s.from], b = ST[s.to]; if (!a.vis || !b.vis) return;
    el('line',{x1:a.cx,y1:a.cy,x2:b.cx,y2:b.cy,style:'stroke:var(--ink)','stroke-width':2.2,'stroke-dasharray':'2 4','stroke-linecap':'round'}, gRoute);
  });
}
function renderPins(){
  gPins.innerHTML = '';
  [['A','#22a06b'],['B','#e8473f']].forEach(([w,c]) => {
    const id = state[w]; if (!id) return; const s = ST[id]; if (!s.vis) return;
    const g = el('g',{transform:`translate(${s.cx.toFixed(1)},${(s.cy - s.ow/2 - 2).toFixed(1)})`, class:'pin'+w}, gPins);
    el('path',{d:'M0 0 C -4 -8 -11 -12 -11 -20 A 11 11 0 1 1 11 -20 C 11 -12 4 -8 0 0Z', fill:c, stroke:'#fff', 'stroke-width':2}, g);
    const t = el('text',{x:0,y:-16,'text-anchor':'middle','font-size':11,'font-weight':800,fill:'#fff','font-family':'Outfit'}, g); t.textContent = w==='A'?'出':'到';
  });
}
function runRoute(){
  const out = $('#routeOut');
  if (!state.A || !state.B){ out.innerHTML = `<div class="note">請選擇出發站與到達站，也可以在地圖上點擊車站。</div>`; return; }
  if (state.A === state.B){ out.innerHTML = `<div class="note">出發站與到達站相同。</div>`; return; }
  const r = findRoute(state.A, state.B, state.pref);
  state.route = r; state.focus = null; renderLineList();
  if (!r){ out.innerHTML = `<div class="note">找不到路線（可能隱藏了部分營運者的路線）。</div>`; state.dirty = true; return; }
  const legsN = r.legs.length;
  let html = `<div class="rsum"><div class="t">${Math.round(r.total)}<small>分</small></div>
    <div class="m">轉乘 <b>${legsN-1}</b> 次 · 共 <b>${r.legs.reduce((a,l)=>a+l.idx.length-1,0)}</b> 站<br>約 <b>${r.km.toFixed(1)}</b> km · ${r.legs.map(l=>lineBadge(LMAP[l.line],true)).join(' ')}</div></div><div class="steps">`;
  let clock = 0;
  r.steps.forEach((s,si) => {
    if (s.type==='leg'){
      const L = LMAP[s.leg.line], seq = L.seq, i0 = s.leg.idx[0], i1 = s.leg.idx[s.leg.idx.length-1];
      const from = ST[seq[i0]], to = ST[seq[i1]];
      const dirTerm = L.loop ? (i1>i0 ? '內回り（逆時針）' : '外回り（順時針）') : '往 ' + ST[i1>i0 ? seq[seq.length-1] : seq[0]].ja + ' 方向';
      const mids = s.leg.idx.slice(1,-1).map(i => ST[seq[i]].ja);
      html += `<div class="stp"><span class="dot" style="${si===0?'border-color:#22a06b':''}"></span><span class="nm">${from.ja}<small>${L.codes[i0]}</small></span><span class="tm">${fmtMin(clock)}</span></div>
        <div class="leg"><span class="bar" style="background:${L.color}"></span><div class="info">
          <div class="ttl">${lineBadge(L,true)} ${L.name}</div>${dirTerm} · ${s.leg.idx.length-1} 站 · 約 ${Math.round(s.leg.t)} 分
          ${mids.length ? `<details><summary>▸ 經過 ${mids.length} 站</summary><div>${mids.join(' → ')}</div></details>` : ''}
        </div></div>`;
      clock += s.leg.t;
      if (si === r.steps.length-1) html += `<div class="stp"><span class="dot" style="border-color:var(--accent)"></span><span class="nm">${to.ja}<small>${L.codes[i1]}</small></span><span class="tm">${fmtMin(clock)}</span></div>`;
    } else {
      const t = s.type==='walk' ? `🚶 步行轉乘 ${ST[s.from].ja} → ${ST[s.to].ja} · 約 ${Math.round(s.t)} 分` : `🔁 站內轉乘 · 約 ${Math.round(s.t)} 分`;
      html += `<div class="xfer"><span class="w"></span><span>${t}</span></div>`;
      clock += s.t;
    }
  });
  html += `</div><div class="note">※ 時間為依站距估算之概略值（含停站與轉乘步行），實際請以官方時刻為準。</div>`;
  out.innerHTML = html;
  state.dirty = true; state.labelsDirty = true;
  fitView([...r.stations], true, 4);
}
const fmtMin = m => `+${Math.round(m)} 分`;
function setEnd(w, id){
  state[w] = id; $('#in'+w).value = ST[id].ja + '（' + ST[id].en + '）';
  closeStation();
  if (state.A && state.B) runRoute(); else { state.dirty = true; centerOn(id); }
}
$('#goBtn').onclick = runRoute;
$('#swap').onclick = () => { [state.A,state.B] = [state.B,state.A]; const a=$('#inA').value; $('#inA').value=$('#inB').value; $('#inB').value=a; if (state.A&&state.B) runRoute(); else state.dirty=true; };
$('#prefBtns').querySelectorAll('button').forEach(b => b.onclick = () => {
  state.pref = b.dataset.p; $('#prefBtns').querySelectorAll('button').forEach(x => x.classList.toggle('on', x===b)); if (state.route) runRoute();
});

/* ---------- autocomplete ---------- */
const norm = s => s.toLowerCase().replace(/[^a-z0-9぀-ヿ一-鿿]/g,'');
// a few Traditional-Chinese aliases so that typing in 中文 works too
const ALIAS = {shibuya:'澀谷',ikebukuro:'池袋',ueno:'上野',asakusa:'淺草',ginza:'銀座',tokyo:'東京',shinjuku:'新宿',akihabara:'秋葉原',roppongi:'六本木',
  omotesando:'表參道',shimbashi:'新橋',otemachi:'大手町',nihombashi:'日本橋',oshiage:'押上 晴空塔 skytree',meijijingumae:'明治神宮前 原宿',tsukiji:'築地',toyosu:'豐洲',
  kitasenju:'北千住',iidabashi:'飯田橋',kudanshita:'九段下',yotsuya:'四谷',kasumigaseki:'霞關',ochanomizu:'御茶之水',shinochanomizu:'新御茶之水',ryogoku:'兩國',
  kinshicho:'錦糸町',gotanda:'五反田',meguro:'目黑',ebisu:'惠比壽',nakameguro:'中目黑',korakuen:'後樂園 東京巨蛋',suidobashi:'水道橋 東京巨蛋',hamamatsucho:'濱松町',
  daimon:'大門 東京鐵塔',akabanebashi:'赤羽橋 東京鐵塔',kamiyacho:'神谷町 東京鐵塔',sengakuji:'泉岳寺',shinagawa:'品川',harajuku:'原宿',yurakucho:'有樂町',
  tochomae:'都廳前',kachidoki:'勝鬨',monzennakacho:'門前仲町',kiyosumi:'清澄白河',toranomonhills:'虎之門之丘',toranomon:'虎之門',nippori:'日暮里',nishinippori:'西日暮里'};
STA.forEach(s => { s.key = [s.ja, s.en, ALIAS[s.id]||'', s.id, ...s.codes.map(c=>c.code)].map(norm).join(' '); });
function setupAC(w){
  const inp = $('#in'+w), ac = $('#ac'+w); let items = [], cur = 0;
  const show = () => {
    const q = norm(inp.value);
    if (!q){ ac.classList.remove('on'); return; }
    items = STA.filter(s => s.vis!==false && s.key.includes(q))
      .sort((a,b) => (b.key.startsWith(q)?1:0)-(a.key.startsWith(q)?1:0) || b.groups.length-a.groups.length).slice(0,9);
    cur = 0;
    ac.innerHTML = items.map((s,i) => `<div data-i="${i}" class="${i===0?'on':''}">${s.lines.filter(l=>!LMAP[l].hidden).map(l=>lineBadge(LMAP[l],true)).join('')}<b>${s.ja}</b><span class="en">${s.en}</span></div>`).join('') || `<div style="color:var(--muted)">沒有符合的車站</div>`;
    ac.classList.add('on');
    ac.querySelectorAll('[data-i]').forEach(d => d.onmousedown = e => { e.preventDefault(); pick(+d.dataset.i); });
  };
  const pick = i => { const s = items[i]; if (!s) return; ac.classList.remove('on'); setEnd(w, s.id); inp.blur(); };
  inp.addEventListener('input', show);
  inp.addEventListener('focus', () => { inp.select(); show(); });
  inp.addEventListener('blur', () => setTimeout(() => ac.classList.remove('on'), 120));
  inp.addEventListener('keydown', e => {
    if (!ac.classList.contains('on')) return;
    if (e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); cur = (cur + (e.key==='ArrowDown'?1:-1) + items.length) % Math.max(1,items.length);
      ac.querySelectorAll('[data-i]').forEach((d,i) => d.classList.toggle('on', i===cur)); }
    else if (e.key==='Enter'){ e.preventDefault(); pick(cur); }
    else if (e.key==='Escape'){ ac.classList.remove('on'); }
  });
}
setupAC('A'); setupAC('B');

/* =====================================================================
   Line list & line strip diagram
   ===================================================================== */
const lineView = $('#lineView');
function renderLineList(){
  if (state.focus) return showLine(state.focus, true);
  let html = '';
  for (const op of ['metro','toei','jr']){
    const ls = LINES.filter(L => L.op===op && !L.hidden);
    html += `<div class="card lgrp"><div class="lgh"><span>${OPS[op].name} <span class="mono" style="font-weight:500">${OPS[op].en}</span></span>
      <label><input type="checkbox" data-op="${op}" ${state.hiddenOps.has(op)?'':'checked'}>顯示</label></div>`;
    ls.forEach(L => {
      const n = new Set(LINES.filter(x=>x.group===L.group).flatMap(x=>x.seq)).size;
      html += `<div class="lrow" data-l="${L.id}" style="--c:${L.color}">${lineBadge(L)}<span class="n">${L.name}<small>${L.en}</small></span><span class="cnt">${n} 站</span></div>`;
    });
    html += `</div>`;
  }
  html += `<div class="hint">👆 拖曳地圖移動、滾輪或雙指縮放、雙擊放大<br>🚉 點車站看資訊，也能設成出發站或目的地<br>🌈 點上面的路線看整條線的車站<br>
    ※ 車站位置依實際地理座標繪製（概略值），為示意用途。</div>`;
  lineView.innerHTML = html;
  lineView.querySelectorAll('.lrow').forEach(r => r.onclick = () => showLine(r.dataset.l));
  lineView.querySelectorAll('[data-op]').forEach(c => c.onchange = () => {
    if (c.checked) state.hiddenOps.delete(c.dataset.op); else state.hiddenOps.add(c.dataset.op);
    if (state.route && state.A && state.B) runRoute();
    state.dirty = true; state.labelsDirty = true;
  });
}
function showLine(gid, keepView){
  const L = LMAP[gid]; state.focus = L.group; state.route = null; $('#routeOut').innerHTML = '';
  state.dirty = true; state.labelsDirty = true;
  const branches = LINES.filter(x => x.group===L.group);
  let html = `<button class="back" id="backBtn">← 回到路線列表</button><div class="card">
    <div class="strip-h">${lineBadge(L)}<div><h2>${L.name}</h2><small>${L.en} · ${OPS[L.op].name}</small></div></div>`;
  branches.forEach((B, bi) => {
    if (bi>0) html += `<div class="sec" style="margin-top:14px">${B.name}</div>`;
    html += `<div class="strip">`;
    B.seq.forEach((id,i) => {
      if (bi>0 && i===0) return; // branch junction is listed on the main line
      const s = ST[id];
      const others = s.lines.filter(l => LMAP[l].group!==L.group && !LMAP[l].hidden).map(l => lineBadge(LMAP[l],true)).join('');
      const osi = s.osi.length ? `<span title="步行轉乘" style="font-size:11px">🚶</span>` : '';
      html += `<div class="srow${s.xchg?' x':''}" data-s="${id}" style="--c:${B.color}"><span class="code">${B.codes[i]}</span><span class="rail"></span><span class="sd"></span>
        <span class="snm">${s.ja}<small>${s.en}</small><span class="xf">${others}${osi}</span></span></div>`;
    });
    html += `</div>`;
  });
  html += `</div>`;
  lineView.innerHTML = html;
  $('#backBtn').onclick = () => { state.focus = null; renderLineList(); state.dirty = true; state.labelsDirty = true; fitView(); };
  lineView.querySelectorAll('.srow').forEach(r => r.onclick = () => { openStation(r.dataset.s); centerOn(r.dataset.s, 3); });
  if (!keepView) fitView([...new Set(branches.flatMap(b=>b.seq))], true, 3.5);
}

/* =====================================================================
   Toggles
   ===================================================================== */
$('#tTrain').onclick = e => { state.trains = !state.trains; e.currentTarget.classList.toggle('on', state.trains); };
$('#tEn').onclick = e => { state.en = !state.en; e.currentTarget.classList.toggle('on', state.en); state.labelsDirty = true; };
$('#tTheme').onclick = e => { const d = document.body.classList.toggle('dark'); e.currentTarget.textContent = d ? '☀️' : '🌙'; };
window.addEventListener('keydown', e => {
  if (e.target.tagName==='INPUT') return;
  if (e.key==='+'||e.key==='=') smoothZoom(1.4); else if (e.key==='-') smoothZoom(1/1.4);
  else if (e.key==='Escape'){ closeStation(); if (state.route){ state.route=null; $('#routeOut').innerHTML=''; state.dirty=true; state.labelsDirty=true; } }
  else if (e.key==='0') fitView();
});
window.addEventListener('resize', () => { state.dirty = true; state.labelsDirty = true; });

/* =====================================================================
   Main loop
   ===================================================================== */
buildDecor();
seedTrains();
renderLineList();
fitView(null, false);
// deep links: #from=shibuya&to=oshiage  |  #line=E  |  #dark
(() => {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.has('dark')) $('#tTheme').click();
  if (h.has('pref')) state.pref = h.get('pref')==='few' ? 'few' : 'fast';
  const f = h.get('from'), t = h.get('to');
  if (f && ST[f]) { state.A = f; $('#inA').value = ST[f].ja + '（' + ST[f].en + '）'; }
  if (t && ST[t]) { state.B = t; $('#inB').value = ST[t].ja + '（' + ST[t].en + '）'; }
  render();
  if (state.A && state.B) runRoute();
  else if (h.get('line') && LMAP[h.get('line')]) showLine(h.get('line'));
})();
let last = performance.now();
function loop(now){
  const dt = Math.min(.05, (now-last)/1000); last = now;
  if (state.dirty){ render(); state.dirty = false; }
  if (state.labelsDirty && !drag.on && !fly){ placeLabels(); state.labelsDirty = false; }
  updateTrains(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
